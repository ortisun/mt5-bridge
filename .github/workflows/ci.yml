name: CI

on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: make sync

      - name: Check the lock file, style, types, import rule, tests and build
        run: make check

      - name: Check the commit messages of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make commits COMMIT_RANGE="$BASE_SHA..$HEAD_SHA"

  windows:
    # The bridge runs on Windows with the real MetaTrader5 wheel. This job proves that the
    # locked environment installs there and that the fake-terminal tests pass on Windows.
    # It has no terminal, so it does not exercise real_client.py against a broker.
    name: Windows install
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version-file: .python-version
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Import the terminal library
        run: uv run --locked python -c "import MetaTrader5; print(MetaTrader5.__version__)"

      - name: Run the tests
        run: uv run --locked pytest
