name: Release

# A pushed release tag becomes a GitHub Release with its notes and the build.
# The tag is made locally by `cz bump` and pushed only after the gate passed and the
# release branch was merged into main (docs/release.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that is not on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version-file: .python-version
          enable-cache: true

      - name: Install dependencies
        run: make sync

      - name: Check the lock file, style, types, import rule, tests and build
        run: make check

      - name: Check the contract version and write the release notes
        run: |
          python3 tools/release.py contract-check
          python3 tools/release.py notes --output dist/release-notes.md

      - name: Package the application tree for the Windows guest
        run: make package

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          --title "mt5-bridge $GITHUB_REF_NAME"
          --notes-file dist/release-notes.md
          dist/mt5-bridge-app.zip dist/*.whl dist/*.tar.gz
